name: Deploy to portal

on:
  push:
    branches: [main]
  workflow_dispatch:

# Merging several PRs back to back starts several deploys; run them one at a time
# so two builds never collide on the server.
concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The server enforces a forced command on this key (see authorized_keys),
      # so the command we pass here is ignored remotely — it always runs the
      # same pinned deploy sequence regardless of what we send.
      - name: Trigger deploy on portal
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ secrets.SSH_PORT }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "deploy"
