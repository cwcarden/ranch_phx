<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papers — Gimel Ranch</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8b5cf6" />
<style>
  :root {
    --brand: #8b5cf6; --brand-soft: #ede9fe; --surface: #ffffff; --surface2: #f9fafb;
    --border: #e5e7eb; --text: #111827; --text2: #6b7280; --text3: #9ca3af;
    --paper: #0f766e; --warn: #b45309; --radius: 14px;
  }
  [data-theme="dark"] {
    --brand: #a78bfa; --brand-soft: #2e1065; --surface: #1e1e2e; --surface2: #16161e;
    --border: #2d2d3d; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --paper: #2dd4bf; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--surface2); color: var(--text);
    padding: max(20px, env(safe-area-inset-top)) 16px 32px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; }
  .subtitle { color: var(--text2); font-size: 14px; margin-top: 3px; }
  .app-link {
    color: var(--brand); text-decoration: none; font-size: 15px; font-weight: 700;
    border: 1.5px solid var(--border); padding: 0 16px; min-height: 44px; display: inline-flex; align-items: center;
    border-radius: 12px; background: var(--surface);
  }
  .note {
    font-size: 13.5px; color: var(--text2); background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
  }
  .horse { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; }
  .horse-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1.5px solid var(--border); }
  .horse-name { font-size: 18px; font-weight: 800; }
  .show-btn {
    border: none; background: var(--paper); color: #fff; font-size: 16px; font-weight: 800;
    min-height: 48px; padding: 0 20px; border-radius: 12px; cursor: pointer;
  }
  [data-theme="dark"] .show-btn { color: #042f2e; }
  .doc-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .doc-row:last-child { border-bottom: none; }
  .doc-info { flex: 1; min-width: 0; background: none; border: none; text-align: left; color: inherit; cursor: pointer; padding: 4px 0; font: inherit; }
  .doc-type { font-size: 16px; font-weight: 700; }
  .doc-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .doc-meta .warn { color: var(--warn); font-weight: 700; }
  .doc-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; min-height: 44px; padding: 0 8px; }
  .doc-remove:disabled { color: var(--border); cursor: not-allowed; }
  .empty { text-align: center; padding: 50px 20px; color: var(--text2); font-size: 15px; line-height: 1.5; background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius); }

  /* Show mode: full screen, one paper at a time */
  .show { display: none; position: fixed; inset: 0; z-index: 50; background: #1f2937; flex-direction: column; }
  .show.open { display: flex; }
  .show-bar { display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: var(--surface); border-bottom: 1.5px solid var(--border); }
  .show-name { font-size: 17px; font-weight: 800; white-space: nowrap; }
  .show-tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 2px; }
  .show-tabs::-webkit-scrollbar { display: none; }
  .show-tab { flex: none; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; min-height: 48px; padding: 4px 14px; cursor: pointer; text-align: left; font: inherit; }
  .show-tab b { display: block; font-size: 15px; }
  .show-tab small { font-size: 12px; color: var(--text2); }
  .show-tab small.warn { color: var(--warn); font-weight: 700; }
  .show-tab.on { background: var(--paper); border-color: var(--paper); color: #fff; }
  .show-tab.on small { color: rgba(255,255,255,.85); }
  [data-theme="dark"] .show-tab.on, [data-theme="dark"] .show-tab.on small { color: #042f2e; }
  .show-close { flex: none; border: none; background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); font-size: 15px; font-weight: 700; min-height: 48px; padding: 0 16px; border-radius: 12px; cursor: pointer; }
  .show-share { display: inline-flex; align-items: center; gap: 6px; }
  @media (max-width: 600px) { .show-share span { display: none; } .show-bar { flex-wrap: wrap; } .show-tabs { order: 3; flex-basis: 100%; } }
  .show-body { position: relative; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .show-body canvas, .show-body img { display: block; margin: 0 auto 12px; max-width: 100%; background: #fff; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .show-msg { color: #fff; text-align: center; padding: 50px 20px; font-size: 16px; }
  .show-msg a { color: #a78bfa; }
  .show-nav { position: fixed; top: 50%; z-index: 51; width: 52px; height: 52px; border-radius: 50%; border: none; background: rgba(17,24,39,.55); color: #fff; font-size: 26px; cursor: pointer; display: none; }
  .show.open .show-nav.has { display: block; }
  .show-prev { left: 10px; } .show-next { right: 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Papers</h1>
        <div class="subtitle">Saved on this device. They open with no signal.</div>
      </div>
      <a class="app-link" id="back-link" href="/">‹ Back to the app</a>
    </header>
    <div id="content"></div>
  </div>

  <div id="show" class="show" role="dialog" aria-label="Papers">
    <div class="show-bar">
      <span id="show-name" class="show-name"></span>
      <div id="show-tabs" class="show-tabs"></div>
      <button class="show-close show-share" id="show-share" onclick="shareCurrent()" aria-label="Share, print or send this paper">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        <span>Share</span>
      </button>
      <button class="show-close" onclick="closeShow()">Done</button>
    </div>
    <div id="show-body" class="show-body"></div>
    <button id="show-prev" class="show-nav show-prev" onclick="step(-1)" aria-label="Previous paper">‹</button>
    <button id="show-next" class="show-nav show-next" onclick="step(1)" aria-label="Next paper">›</button>
  </div>

  <script>
    const STORAGE_KEY = "gimelRanchOfflineDocs";
    const DOCS_CACHE = "ranch-docs-v1";
    const TYPE_ORDER = ["coggins", "health_cert", "registration", "brand_inspection"];
    const TYPE_LABELS = {
      coggins: "Coggins", health_cert: "Health certificate", registration: "Registration",
      brand_inspection: "Brand inspection", dna_report: "DNA report", bill_of_sale: "Bill of sale",
      invoice: "Invoice", contract: "Contract", other: "Document"
    };

    document.documentElement.setAttribute("data-theme", localStorage.getItem("phx:theme") || "light");

    function loadDocs() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
    }
    function saveDocs(docs) { localStorage.setItem(STORAGE_KEY, JSON.stringify(docs)); }
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
    function label(doc) { return doc.label || TYPE_LABELS[doc.docType] || doc.title || "Document"; }
    function rank(doc) { const i = TYPE_ORDER.indexOf(doc.docType); return i < 0 ? 99 : i; }
    function isImage(doc) {
      return (doc.mime || "").startsWith("image/") || /\.(jpe?g|png|webp|gif|heic)(\?|$)/i.test(doc.url || "");
    }

    // "Mar 10, 2026 · 7 months old", with a nudge when a Coggins is over a year old or
    // a health certificate is over 30 days old (rules vary by state and show).
    function dated(doc) {
      if (!doc.docDate) return {text: doc.title || "", warn: false};
      const d = new Date(doc.docDate + "T12:00:00");
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      const when = d.toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"});
      let age = days <= 0 ? "today" : days < 60 ? `${days} days old` : `${Math.round(days / 30.4)} months old`;
      const warn = (doc.docType === "coggins" && days > 365) || (doc.docType === "health_cert" && days > 30);
      if (warn) age += doc.docType === "coggins" ? " (over a year)" : " (over 30 days)";
      return {text: `${when} · ${age}`, warn};
    }

    // ── Showing one horse's papers, full screen ──
    let showDocs = [], showIndex = 0, currentTask = null, pdfjsPromise = null;

    // Free the PDF worker of the paper on screen before showing another.
    function stopPdf() {
      if (currentTask) { try { currentTask.destroy(); } catch (e) {} currentTask = null; }
    }

    function loadPdfjs() {
      if (!pdfjsPromise) {
        pdfjsPromise = import("/pdfjs/pdf.min.mjs").then((lib) => {
          lib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
          return lib;
        });
      }
      return pdfjsPromise;
    }

    function openShow(animalKey, startUrl) {
      showDocs = loadDocs()
        .filter((d) => String(d.animalId || d.animalName) === String(animalKey))
        .sort((a, b) => rank(a) - rank(b) || String(b.docDate || "").localeCompare(String(a.docDate || "")));
      if (showDocs.length === 0) return;
      showIndex = Math.max(0, showDocs.findIndex((d) => d.url === startUrl));
      document.getElementById("show-name").textContent = showDocs[0].animalName || "";
      document.getElementById("show").classList.add("open");
      document.body.style.overflow = "hidden";
      renderShow();
    }
    window.openShow = openShow;

    function closeShow() {
      // Opened straight from a horse's Papers button: Done goes back to that horse.
      const from = new URLSearchParams(location.search).get("animal");
      if (from && navigator.onLine) { location.href = "/animals/" + encodeURIComponent(from); return; }
      document.getElementById("show").classList.remove("open");
      document.getElementById("show-body").innerHTML = "";
      document.body.style.overflow = "";
      stopPdf();
      if (location.search) history.replaceState(null, "", location.pathname);
    }
    window.closeShow = closeShow;

    function step(n) {
      if (showDocs.length < 2) return;
      showIndex = (showIndex + n + showDocs.length) % showDocs.length;
      renderShow();
    }
    window.step = step;

    function pick(i) { showIndex = i; renderShow(); }
    window.pick = pick;

    function renderShow() {
      const tabs = document.getElementById("show-tabs");
      tabs.innerHTML = showDocs.map((d, i) => {
        const dt = dated(d);
        return `<button class="show-tab ${i === showIndex ? "on" : ""}" onclick="pick(${i})">
          <b>${esc(label(d))}</b><small class="${dt.warn ? "warn" : ""}">${esc(dt.text)}</small></button>`;
      }).join("");
      const on = tabs.children[showIndex];
      if (on) on.scrollIntoView({inline: "center", block: "nearest"});
      for (const id of ["show-prev", "show-next"]) document.getElementById(id).classList.toggle("has", showDocs.length > 1);
      renderDoc(showDocs[showIndex]);
      prepareShare(showDocs[showIndex]);
    }

    async function renderDoc(doc) {
      const body = document.getElementById("show-body");
      body.scrollTop = 0;
      stopPdf();
      if (isImage(doc)) {
        body.innerHTML = `<img src="${esc(doc.url)}" alt="${esc(label(doc))}">`;
        body.querySelector("img").onerror = () => failed(body, doc);
        return;
      }
      body.innerHTML = `<p class="show-msg">Loading…</p>`;
      try {
        const lib = await loadPdfjs();
        // One plain GET: cached copies don't reliably answer range requests (Safari).
        const task = lib.getDocument({url: doc.url, disableRange: true, disableStream: true});
        currentTask = task;
        const pdf = await task.promise;
        if (currentTask !== task) return;
        body.innerHTML = "";
        const width = Math.min(body.clientWidth - 24, 1100);
        const ratio = window.devicePixelRatio || 1;
        for (let i = 1; i <= pdf.numPages; i++) {
          if (currentTask !== task) return;
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({scale: (width / page.getViewport({scale: 1}).width) * ratio});
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = viewport.width / ratio + "px";
          body.appendChild(canvas);
          await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
        }
      } catch (e) {
        if (showDocs[showIndex] === doc) failed(body, doc);
      }
    }

    // ── Share (Messages, Mail, Print, Save to Files) ──
    // The file is read ahead while the paper is on screen, so the share sheet opens
    // right away when Share is tapped (iOS wants it straight from the tap).
    const shareFiles = new Map();

    function fileName(doc) {
      const ext = (doc.url.split("?")[0].match(/\.[a-z0-9]+$/i) || [""])[0];
      const base = [doc.animalName, label(doc), doc.docDate].filter(Boolean).join(" - ").replace(/[\\/:*?"<>|]+/g, "");
      return (base || "Document") + ext;
    }

    function prepareShare(doc) {
      if (shareFiles.has(doc.url)) return shareFiles.get(doc.url);
      const p = fetch(doc.url)
        .then((r) => { if (!r.ok) throw new Error("not found"); return r.blob(); })
        .then((blob) => new File([blob], fileName(doc), {type: blob.type || doc.mime || "application/octet-stream"}))
        .catch(() => { shareFiles.delete(doc.url); return null; });
      shareFiles.set(doc.url, p);
      return p;
    }

    async function shareDoc(doc) {
      const file = await prepareShare(doc);
      if (!file) { alertShare("This paper isn't saved on this device. Open it again with a connection."); return; }
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        try { await navigator.share({files: [file], title: label(doc)}); } catch (e) {}
        return;
      }
      // No share sheet (some desktop browsers): save the file instead.
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }

    function alertShare(text) {
      const body = document.getElementById("show-body");
      const p = document.createElement("p");
      p.className = "show-msg"; p.textContent = text;
      body.prepend(p);
      setTimeout(() => p.remove(), 4000);
    }

    function shareCurrent() { if (showDocs[showIndex]) shareDoc(showDocs[showIndex]); }
    window.shareCurrent = shareCurrent;

    // Never send the app to the bare file (in the Home Screen app there's no way back);
    // offer the share sheet instead (Files, Print, Mail).
    function failed(body, doc) {
      body.innerHTML = `<p class="show-msg">This one can't be shown here.<br><button class="show-close" style="margin-top:14px">Share it</button></p>`;
      body.querySelector("button").onclick = () => shareDoc(doc);
    }

    // Swipe left or right between papers.
    (() => {
      let x0 = null, y0 = null;
      const el = document.getElementById("show-body");
      el.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) { x0 = null; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, {passive: true});
      el.addEventListener("touchend", (e) => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
        x0 = null;
      }, {passive: true});
    })();

    window.addEventListener("keydown", (e) => {
      if (!document.getElementById("show").classList.contains("open")) return;
      if (e.key === "Escape") closeShow();
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    });

    // ── The list ──
    // Removing is only allowed online: offline, a removed paper can't be saved again.
    async function removeDoc(url) {
      if (!navigator.onLine) return;
      saveDocs(loadDocs().filter((d) => d.url !== url));
      // Remember it was taken off on purpose, so the app's Papers button doesn't put it back.
      try {
        const removed = new Set(JSON.parse(localStorage.getItem("gimelRanchOfflineRemoved") || "[]"));
        removed.add(url);
        localStorage.setItem("gimelRanchOfflineRemoved", JSON.stringify([...removed]));
      } catch (e) {}
      if ("caches" in window) await (await caches.open(DOCS_CACHE)).delete(url);
      render();
    }
    window.removeDoc = removeDoc;

    function render() {
      const docs = loadDocs();
      const content = document.getElementById("content");
      if (docs.length === 0) {
        content.innerHTML = `<div class="empty">No papers saved on this device yet.<br>
          With a connection, open a horse in the app and tap <b>Papers</b>.<br>
          They're saved here so they open at the arena with no signal.</div>`;
        return;
      }
      const groups = {};
      for (const d of docs) (groups[d.animalId || d.animalName] ||= []).push(d);
      const online = navigator.onLine;
      const keys = Object.keys(groups).sort((a, b) => String(groups[a][0].animalName).localeCompare(String(groups[b][0].animalName)));
      const html = keys.map((key) => {
        const list = groups[key].sort((a, b) => rank(a) - rank(b));
        const k = esc(key).replace(/'/g, "\\'");
        const rows = list.map((d) => {
          const dt = dated(d);
          const u = esc(d.url).replace(/'/g, "\\'");
          return `<div class="doc-row">
            <button class="doc-info" onclick="openShow('${k}', '${u}')">
              <div class="doc-type">${esc(label(d))}</div>
              <div class="doc-meta"><span class="${dt.warn ? "warn" : ""}">${esc(dt.text)}</span></div>
            </button>
            <button class="doc-remove" ${online ? "" : "disabled"} onclick="removeDoc('${u}')">Remove</button>
          </div>`;
        }).join("");
        return `<div class="horse">
          <div class="horse-head"><span class="horse-name">${esc(list[0].animalName || "Unknown")}</span>
            <button class="show-btn" onclick="openShow('${k}')">Show papers</button></div>
          ${rows}</div>`;
      }).join("");
      const note = online ? "" : `<div class="note">No signal. Your saved papers still open. Removing is off until you're back online.</div>`;
      content.innerHTML = note + html;
    }

    window.addEventListener("online", render);
    window.addEventListener("offline", render);
    render();

    // Opened from the app's Papers button: go straight to that horse's papers.
    const params = new URLSearchParams(location.search);
    if (params.get("animal")) {
      // Opened from a horse's Papers button: "Back" goes to that horse.
      document.getElementById("back-link").href = "/animals/" + encodeURIComponent(params.get("animal"));
      openShow(params.get("animal"));
    }
  </script>
</body>
</html>
