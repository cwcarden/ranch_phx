<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline Documents — Gimel Ranch</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8b5cf6" />
<style>
  :root {
    --brand: #8b5cf6; --brand-soft: #ede9fe; --surface: #ffffff; --surface2: #f9fafb;
    --border: #e5e7eb; --text: #111827; --text2: #6b7280; --text3: #9ca3af;
    --radius: 12px; --radius-sm: 8px;
  }
  [data-theme="dark"] {
    --brand: #a78bfa; --brand-soft: #2e1065; --surface: #1e1e2e; --surface2: #16161e;
    --border: #2d2d3d; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--surface2); color: var(--text); padding: 20px;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .subtitle { color: var(--text2); font-size: 13px; margin-top: 2px; }
  .app-link {
    color: var(--brand); text-decoration: none; font-size: 14px; font-weight: 600;
    border: 1.5px solid var(--border); padding: 8px 14px; border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .horse-group { margin-bottom: 28px; }
  .horse-name { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .doc-list {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .doc-row {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 1.5px solid var(--border);
  }
  .doc-row:last-child { border-bottom: none; }
  .doc-info { flex: 1; min-width: 0; }
  .doc-title { font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; display: block; }
  .doc-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .doc-type-badge {
    background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 20px; letter-spacing: .02em;
  }
  .doc-date { font-size: 12px; color: var(--text2); }
  .doc-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .doc-open {
    color: var(--brand); text-decoration: none; font-size: 13px; font-weight: 600;
  }
  .doc-remove {
    background: none; border: none; color: var(--text3); cursor: pointer; font-size: 12px;
    padding: 4px 8px;
  }
  .doc-remove:hover { color: #ef4444; }
  .doc-remove:disabled { color: var(--border); cursor: not-allowed; }
  .doc-remove:disabled:hover { color: var(--border); }
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px;
    background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius);
  }
  .offline-note {
    font-size: 12.5px; color: var(--text2); background: var(--surface2);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 12px; margin-bottom: 16px;
  }
  .pdf-viewer-overlay {
    display: none; position: fixed; inset: 0; background: #000; z-index: 9999;
    flex-direction: column;
  }
  .pdf-viewer-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--surface); border-bottom: 1.5px solid var(--border);
  }
  .pdf-viewer-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .pdf-viewer-close {
    background: var(--brand); border: none; color: #fff; font-size: 14px; font-weight: 700;
    padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .pdf-viewer-pages { flex: 1; overflow-y: auto; padding: 16px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Offline Documents</h1>
      <div class="subtitle">Available without a connection</div>
    </div>
    <a class="app-link" href="/">Open App</a>
  </header>

  <div id="content"></div>

  <div id="pdf-viewer-overlay" class="pdf-viewer-overlay">
    <div class="pdf-viewer-bar">
      <span id="pdf-viewer-title" class="pdf-viewer-title"></span>
      <button class="pdf-viewer-close" onclick="closePdfViewer()">✕ Close</button>
    </div>
    <div id="pdf-viewer-pages" class="pdf-viewer-pages"></div>
  </div>

  <script>
    const STORAGE_KEY = "gimelRanchOfflineDocs";
    const DOCS_CACHE = "ranch-docs-v1";

    (() => {
      const setTheme = (theme) => document.documentElement.setAttribute("data-theme", theme);
      setTheme(localStorage.getItem("phx:theme") || "light");
    })();

    function loadDocs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveDocs(docs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
    }

    // iOS Safari's embedded PDF renderer only shows page one inside an
    // <iframe>, so pages are rendered ourselves via PDF.js (vendored
    // locally under /pdfjs so this still works fully offline).
    let pdfjsLibPromise = null;
    function loadPdfjs() {
      if (!pdfjsLibPromise) {
        pdfjsLibPromise = import("/pdfjs/pdf.min.mjs").then((lib) => {
          lib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
          return lib;
        });
      }
      return pdfjsLibPromise;
    }

    // Each getDocument() call spins up a dedicated Worker that stays alive
    // until destroyed — track the current one so opening another document
    // (or closing this one) frees it instead of leaking workers indefinitely.
    let currentPdfDoc = null;

    async function renderPdfPages(container, url) {
      container.innerHTML = '<p style="color:#fff;text-align:center;padding:40px">Loading…</p>';
      try {
        if (currentPdfDoc) {
          currentPdfDoc.destroy();
          currentPdfDoc = null;
        }
        const pdfjsLib = await loadPdfjs();
        // Loading from a fully-cached (often offline) copy, not streaming over
        // a real connection — disable PDF.js's range/streaming fetch strategy
        // so it just does one plain GET. The Cache API doesn't reliably serve
        // partial/range responses from a whole cached Response (inconsistent
        // in Safari especially), which caused intermittent render failures.
        const pdf = await pdfjsLib.getDocument({url, disableRange: true, disableStream: true}).promise;
        currentPdfDoc = pdf;
        container.innerHTML = "";
        const width = container.clientWidth || window.innerWidth;

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({scale: width / page.getViewport({scale: 1}).width});
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.cssText = "display:block;margin:0 auto 12px;max-width:100%";
          container.appendChild(canvas);
          await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
        }
      } catch (e) {
        console.error("Failed to render PDF", e);
        container.innerHTML = `<p style="color:#fff;text-align:center;padding:40px">
          Couldn't render this document. <a href="${url}" style="color:#a78bfa">Open it directly</a> instead.
        </p>`;
      }
    }

    function openPdfViewer(event, url, title) {
      event.preventDefault();
      document.getElementById("pdf-viewer-title").textContent = title || "";
      document.getElementById("pdf-viewer-overlay").style.display = "flex";
      renderPdfPages(document.getElementById("pdf-viewer-pages"), url);
    }
    window.openPdfViewer = openPdfViewer;

    function closePdfViewer() {
      document.getElementById("pdf-viewer-overlay").style.display = "none";
      document.getElementById("pdf-viewer-pages").innerHTML = "";
      if (currentPdfDoc) {
        currentPdfDoc.destroy();
        currentPdfDoc = null;
      }
    }
    window.closePdfViewer = closePdfViewer;

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePdfViewer();
    });

    // Removing a saved document is only safe when online — offline, it can't
    // be re-saved if removed by mistake, and you'd lose access to it for the
    // rest of the trip. The button is disabled while offline as a guard
    // against accidental taps; this check guards against any stale DOM too.
    async function removeDoc(url) {
      if (!navigator.onLine) return;
      const docs = loadDocs().filter((d) => d.url !== url);
      saveDocs(docs);
      if ("caches" in window) {
        const cache = await caches.open(DOCS_CACHE);
        await cache.delete(url);
      }
      render();
    }
    window.removeDoc = removeDoc;

    window.addEventListener("online", render);
    window.addEventListener("offline", render);

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s || "";
      return div.innerHTML;
    }

    function render() {
      const docs = loadDocs();
      const content = document.getElementById("content");

      if (docs.length === 0) {
        content.innerHTML = `<div class="empty-state">
          No documents saved for offline yet.<br>
          Open the app while you have a connection and tap "Save Offline" on any document.
        </div>`;
        return;
      }

      const byHorse = {};
      for (const doc of docs) {
        const key = doc.animalName || "Unknown";
        (byHorse[key] = byHorse[key] || []).push(doc);
      }

      const online = navigator.onLine;
      const sections = Object.keys(byHorse).sort().map((horseName) => {
        const rows = byHorse[horseName].map((doc) => `
          <div class="doc-row">
            <div class="doc-info">
              <a class="doc-title" href="${escapeHtml(doc.url)}" onclick="openPdfViewer(event, this.href, this.textContent)">${escapeHtml(doc.title || "Untitled")}</a>
              <div class="doc-meta">
                ${doc.docType ? `<span class="doc-type-badge">${escapeHtml(doc.docType)}</span>` : ""}
                ${doc.cachedAt ? `<span class="doc-date">Saved ${new Date(doc.cachedAt).toLocaleDateString()}</span>` : ""}
              </div>
            </div>
            <div class="doc-actions">
              <a class="doc-open" href="${escapeHtml(doc.url)}" onclick="openPdfViewer(event, this.href, '${escapeHtml(doc.title || 'Untitled').replace(/'/g, "\\'")}')">Open</a>
              <button class="doc-remove" ${online ? "" : "disabled"} title="${online ? "" : "Reconnect to remove"}" onclick="removeDoc('${escapeHtml(doc.url).replace(/'/g, "\\'")}')">Remove</button>
            </div>
          </div>
        `).join("");

        return `<div class="horse-group">
          <div class="horse-name">${escapeHtml(horseName)}</div>
          <div class="doc-list">${rows}</div>
        </div>`;
      }).join("");

      const note = online ? "" : `<div class="offline-note">You're offline — removing saved documents is disabled until you reconnect, so you can't accidentally lose access to one mid-trip.</div>`;
      content.innerHTML = note + sections;
    }

    render();
  </script>
</body>
</html>
